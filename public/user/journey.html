<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Your reading journey</title>
<link rel="stylesheet" href="/shared/theme.css" />
<style>
  body { overflow-x: hidden; padding-bottom: 104px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 20px 6px 14px;
  }
  .festival { font-weight: 800; color: var(--maroon); font-size: 0.82rem; line-height: 1.25; }
  .top-bar h1 { margin: 2px 0 0; font-size: 1.7rem; line-height: 1.15; word-break: break-word; }
  .count {
    flex: 0 0 auto; background: var(--indigo); color: #fff; border-radius: 14px;
    padding: 7px 13px; text-align: center; line-height: 1.1;
  }
  .count b { font-size: 1.25rem; font-weight: 800; display: block; }
  .count span { font-size: 0.7rem; font-weight: 600; }

  /* the sheet of paper the journey is drawn on */
  .sheet-shadow { filter: drop-shadow(0 10px 14px rgba(34, 28, 82, 0.16)); }
  .sheet { background: var(--paper); padding: 6px 0 34px; }
  #journeySvg { display: block; width: 100%; height: auto; }

  /* a book opening when its stop is visited */
  .bp-open { animation: bpOpen 0.75s cubic-bezier(0.3, 1.5, 0.5, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes bpOpen {
    from { transform: scale(0.55) rotate(-10deg); opacity: 0.2; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  /* the robot mascot: a gentle sway, a blink and now and then a wave while
     it sits; a leaning glide with swinging arms while it moves; a burst of
     sparkles when it arrives */
  .bp-mascot { animation: robotSway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .bp-mascot.walking { animation: robotGlide 0.45s ease-in-out infinite alternate; }
  @keyframes robotSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes robotGlide {
    from { transform: rotate(7deg) translateY(0); }
    to { transform: rotate(9deg) translateY(-1.5px); }
  }
  /* arms turn at the shoulder: top inner corner of each arm */
  .bp-arm { transform-box: fill-box; }
  .bp-arm-l { transform-origin: 100% 0; }
  .bp-arm-r { transform-origin: 0 0; animation: robotWave 6s ease-in-out infinite; }
  @keyframes robotWave {
    0%, 62%, 100% { transform: rotate(0); }
    70%, 86% { transform: rotate(-150deg); }
    74%, 82% { transform: rotate(-125deg); }
    78% { transform: rotate(-150deg); }
  }
  .bp-mascot.walking .bp-arm-r { animation: robotSwing 0.45s ease-in-out infinite alternate; }
  .bp-mascot.walking .bp-arm-l { animation: robotSwing 0.45s ease-in-out infinite alternate-reverse; }
  @keyframes robotSwing { from { transform: rotate(-25deg); } to { transform: rotate(20deg); } }
  .bp-eyes { animation: robotBlink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes robotBlink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .bp-pop { transform-box: fill-box; transform-origin: center; animation: 0.7s ease-out forwards; }
  .bp-pop-1 { animation-name: pop1; }
  .bp-pop-2 { animation-name: pop2; }
  .bp-pop-3 { animation-name: pop3; }
  @keyframes pop1 { from { transform: translate(0, 0) scale(0.4); opacity: 1; } to { transform: translate(-18px, -10px) scale(1.2) rotate(-45deg); opacity: 0; } }
  @keyframes pop2 { from { transform: translate(0, 0) scale(0.4); opacity: 1; } to { transform: translate(0, -20px) scale(1.4); opacity: 0; } }
  @keyframes pop3 { from { transform: translate(0, 0) scale(0.4); opacity: 1; } to { transform: translate(18px, -10px) scale(1.2) rotate(45deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .bp-mascot, .bp-mascot.walking, .bp-arm, .bp-mascot.walking .bp-arm, .bp-eyes, .bp-pop { animation: none; }
    .bp-pop { display: none; }
  }

  /* the ribbon colouring in up to the stop just visited */
  .bp-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: bpDraw 1.1s ease-out forwards; }
  @keyframes bpDraw { to { stroke-dashoffset: 0; } }

  /* stops list, collapsed by default so the page stays short on a phone */
  .stops { margin-top: 18px; padding: 0; }
  .stops summary {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    padding: 1em 1.2em; cursor: pointer; list-style: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stops summary::-webkit-details-marker { display: none; }
  .stops-title { font-weight: 800; display: block; }
  .stops-count { color: var(--muted); font-size: 0.9rem; }
  .stops .chev { flex: 0 0 22px; width: 22px; height: 22px; color: var(--indigo); transition: transform 0.2s ease; }
  .stops[open] .chev { transform: rotate(180deg); }
  #milestoneList { padding: 0 1.2em 0.4em; border-top: 2px solid var(--line); }
  .m-row { display: flex; align-items: center; gap: 0.9em; padding: 0.8em 0; border-bottom: 1px solid var(--line); }
  .m-row:last-child { border-bottom: none; }
  .m-dot {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .m-row.done .m-dot { background: var(--maroon); border-color: var(--maroon); }
  .m-dot svg { width: 14px; height: 14px; display: none; }
  .m-row.done .m-dot svg { display: block; }
  .m-title { font-weight: 700; }
  .m-title-ar { font-weight: 600; font-size: 0.92rem; text-align: right; }
  .m-row > div:last-child { flex: 1; }
  .m-row:not(.done) .m-title, .m-row:not(.done) .m-title-ar { color: var(--muted); }
  .m-desc { font-size: 0.9rem; color: var(--muted); }

  /* QR */
  #qrFab {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 20; white-space: nowrap;
  }
  #qrFab:active { transform: translate(-50%, 4px); }
  #qrModal {
    position: fixed; inset: 0; background: rgba(34, 28, 82, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 30; padding: 1.5em;
  }
  #qrModal.open { display: flex; }
  #qrModal .card { text-align: center; max-width: 330px; width: 100%; }
  #qrModal img { width: 100%; max-width: 250px; border-radius: 16px; border: 6px solid var(--grey); }

  /* reward: the poster's mauve panel with a peach inset */
  .reward { background: var(--mauve); border-radius: 22px; padding: 14px; margin-bottom: 16px; }
  .reward-inner { background: var(--peach); border-radius: 16px; padding: 18px 16px 20px; text-align: center; }
  .reward-kicker { font-weight: 700; color: var(--maroon); font-size: 0.9rem; }
  .reward-title { margin: 2px 0 10px; font-size: 1.5rem; line-height: 1.15; }
  .reward-label {
    display: inline-block; background: var(--indigo); color: #fff; font-weight: 700;
    padding: 8px 20px; border-radius: 12px; font-size: 1.05rem;
  }
  .reward-desc { margin: 10px 0 0; font-size: 0.9rem; }
  .reward-img {
    display: block; width: 100%; height: auto; margin: 14px 0 2px;
    border-radius: 12px; box-shadow: 0 6px 16px rgba(34, 28, 82, 0.15);
  }
  #revealBtn { margin-top: 14px; background: var(--indigo); box-shadow: 0 5px 0 #3f3f73, 0 12px 20px rgba(90, 90, 150, 0.3); }
  #revealBtn:active { box-shadow: 0 1px 0 #3f3f73; }
  .reward-foot { color: #fff; font-weight: 700; text-align: center; padding: 10px 0 0; font-size: 0.9rem; }

  /* "You have completed this milestone!" - slides down from the top */
  #toast {
    position: fixed; top: 14px; left: 50%; z-index: 45;
    width: calc(100% - 32px); max-width: 420px;
    background: var(--mauve); border-radius: 18px; padding: 8px;
    box-shadow: 0 12px 28px rgba(34, 28, 82, 0.25);
    transform: translate(-50%, -140%); opacity: 0; pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.3, 1.4, 0.5, 1), opacity 0.3s ease;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast .toast-title {
    background: var(--peach); border-radius: 12px 12px 0 0; padding: 12px 14px 6px;
    text-align: center; font-weight: 800; font-size: 1.1rem; color: var(--maroon); line-height: 1.25;
  }
  #toast .toast-stop {
    background: var(--peach); padding: 0 14px 4px; text-align: center;
    font-weight: 700; font-size: 0.92rem; color: var(--navy);
  }
  #toast > div:last-child { border-radius: 0 0 12px 12px; padding-bottom: 12px; }
  #toast > div:only-child { border-radius: 12px; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: opacity 0.3s ease; transform: translate(-50%, 0); } }

  .confetti-piece {
    position: fixed; top: -12px; z-index: 40; pointer-events: none; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<svg class="backdrop" id="backdrop" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

<div class="wrap">
  <div class="top-bar">
    <div>
      <div class="festival">Reading &amp; Knowledge Festival</div>
      <h1 id="greeting">Loading…</h1>
    </div>
    <div class="count"><b id="progressBadge">0/0</b><span>stops</span></div>
  </div>

  <div id="rewardSection" style="display:none;"></div>

  <div class="sheet-shadow">
    <div class="sheet" id="sheet">
      <svg id="journeySvg" viewBox="0 0 362 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your journey, one book per stop"></svg>
    </div>
  </div>

  <details class="card stops" id="stopsCard">
    <summary>
      <span>
        <span class="stops-title">All stops</span>
        <span class="stops-count" id="stopsCount"></span>
      </span>
      <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8 L10 13 L15 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div id="milestoneList"></div>
  </details>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<button id="qrFab">Show my code</button>

<div id="qrModal">
  <div class="card">
    <h3>Your code</h3>
    <p class="muted" style="margin-top:0;">Show this to the host at each stop. They scan it and your next book opens.</p>
    <img id="qrImg" alt="Your personal QR code" />
    <div style="margin-top:1.2em;">
      <button class="secondary" id="closeQr">Close</button>
    </div>
  </div>
</div>

<script src="/shared/bookpath.js"></script>
<script src="/user/journey.js"></script>
</body>
</html>
